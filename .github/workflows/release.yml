# Build and publish a GitHub release for the commit this runs on.
#
# The tag is computed, not typed: scripts/version.sh renders vYEAR.MONTH.PATCH
# with PATCH as the commit count, so the full history is needed (fetch-depth:
# 0). A shallow checkout reports patch 0 and the run refuses to release it.
# The release body is the CHANGELOG.md section whose heading is exactly the
# tag.
#
# Three things start it: a tag, a push to main and a manual dispatch. A push to
# main publishes a tagged release only when CHANGELOG.md has a section for the
# version that commit builds.
#
# Every push to main (and a dispatch on main) also refreshes the "edge"
# pre-release: the same bundles built from main's newest commit, which is what
# scripts/quickstart.sh installs by default. Being a pre-release, it never
# becomes GitHub's "latest release".
#
# scripts/quickstart.sh installs from these releases, so the asset names are a
# contract: photoframe-<version>-linux-{arm64,armv7}.tar.gz and SHA256SUMS.
# Beside them goes the Android app as photoframe.apk, a name that never
# changes, so .../releases/latest/download/photoframe.apk is always the newest
# release's app. Its line in SHA256SUMS ends in .apk, which quickstart's
# lookup by "-linux-<arch>.tar.gz" never matches.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

# One run at a time, so two quick pushes can't race on the edge release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the patch number is the commit count; shallow = 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # For the Android app. The runner image ships the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version
        id: version
        run: |
          VERSION="$(scripts/version.sh)"
          if [ "$(scripts/version.sh --patch)" = "0" ]; then
            echo "patch is 0, an unstamped build: refusing to release" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} names a commit that builds ${VERSION}: refusing to publish it" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "patch=$(scripts/version.sh --patch)" >> "$GITHUB_OUTPUT"

      # The changelog heading gates the release. A push to main whose version
      # has no section is an ordinary commit and is skipped. A tag or manual
      # dispatch without the section is an error.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v tag="${{ steps.version.outputs.version }}" '
            $0 == "## " tag { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "no '## ${{ steps.version.outputs.version }}' section in CHANGELOG.md: not a release commit, skipping"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section" >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build release bundles
        run: scripts/build-release.sh

      # The release key, so every release installs over the last one. Without
      # the secrets the APK falls back to this runner's debug key, which no
      # earlier release was signed with, so it warns instead of failing.
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets: the APK is signed with this runner's debug key and will not install over an earlier release"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      # The phone app, stamped with this commit's version: the name the
      # bundles carry, and the commit count as the version code, which only
      # grows. A thin client, so it carries no Go and builds the same for
      # every release line.
      - name: Build photoframe.apk
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :core:test :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.patch }}"
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "expected exactly one release APK, found: ${apks[*]}" >&2
            exit 1
          fi
          cp "${apks[0]}" ../../dist/photoframe.apk
          (cd ../../dist && sha256sum photoframe.apk >> SHA256SUMS)

      - name: Publish release
        if: steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            echo "release ${VERSION} already exists: nothing to publish"
            exit 0
          fi
          gh release create "${VERSION}" \
            dist/photoframe-${VERSION}-linux-*.tar.gz \
            dist/photoframe.apk \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file notes.md

      # The build of main's newest commit, replaced on every push. Quickstart
      # compares its target commit with main's head before using it.
      - name: Publish edge pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release delete edge --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create edge \
            dist/photoframe-${VERSION}-linux-*.tar.gz \
            dist/photoframe.apk \
            dist/SHA256SUMS \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "edge: ${VERSION} (main @ ${GITHUB_SHA::7})" \
            --notes "Automatic build of main at ${GITHUB_SHA}. Replaced on every push to main. Installed by default by scripts/quickstart.sh."
